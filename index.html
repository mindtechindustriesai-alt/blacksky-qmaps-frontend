<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BlackSky QMaps | Quantum 3D Mapping</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">

    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link rel="stylesheet" href="css/style.css">

    <style>
        #particles-js { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .container { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 20px; }
        .handshake-badge { padding: 6px 14px; border-radius: 30px; font-size: 0.7rem; font-family: monospace; border: 1px solid #FFD166; color: #FFD166; background: rgba(255, 209, 102, 0.1); transition: all 0.3s; display: inline-block; margin-left: 10px; }
        .handshake-badge.confirmed { border-color: #00FF88; color: #00FF88; background: rgba(0, 255, 136, 0.1); }
        .handshake-badge.unreachable { border-color: #EF476F; color: #EF476F; background: rgba(239, 71, 111, 0.1); }

        .chat-card { background: rgba(15,25,45,0.45); backdrop-filter: blur(16px); border: 1px solid rgba(0,180,216,0.2); border-radius: 24px; padding: 20px; margin-top: 20px; }
        .chat-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; color: #00B4D8; }
        .chat-messages { height: 200px; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 16px; padding: 15px; margin-bottom: 12px; }
        .chat-message { padding: 10px 14px; margin-bottom: 10px; border-radius: 18px; max-width: 85%; font-size: 0.9rem; line-height: 1.5; }
        .chat-message.user { background: #00B4D8; margin-left: auto; text-align: right; color: #000; }
        .chat-message.ai { background: rgba(255,255,255,0.08); border-left: 2px solid #00F5D4; }
        .chat-input-group { display: flex; gap: 10px; align-items: center; }
        .chat-input { flex: 1; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,180,216,0.2); border-radius: 60px; color: white; font-family: 'Exo 2', sans-serif; }
        .chat-send { background: #00B4D8; border: none; border-radius: 60px; padding: 12px 24px; color: white; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>
    <div id="particles-js"></div>

    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid rgba(0,180,216,0.2); margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
            <div class="logo" style="display: flex; align-items: center; gap: 15px;">
                <h1 style="font-size: 1.5rem; color: #fff;">🌍 BlackSky QMaps</h1>
                <span class="quantum-badge" style="background: rgba(138,43,226,0.2); border: 1px solid #8A2BE2; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; color: #00F5D4;">⚛️ CHSH S=2.76</span>
                <span id="handshakeBadge" class="handshake-badge"><i class="fas fa-satellite-dish"></i> Handshake: Pending...</span>
            </div>
            <div class="controls" style="display: flex; gap: 10px;">
                <button onclick="toggleLanguage()" style="background: rgba(0,180,216,0.2); border: 1px solid #00B4D8; color: white; padding: 8px 16px; border-radius: 30px; cursor: pointer;">🌐 Languages</button>
                <button onclick="toggleQuantum()" style="background: rgba(138,43,226,0.2); border: 1px solid #8A2BE2; color: white; padding: 8px 16px; border-radius: 30px; cursor: pointer;">⚛️ Quantum</button>
            </div>
        </header>

        <!-- MAP CONTAINER -->
        <div id="map-container" style="height: 400px; border-radius: 16px; overflow: hidden; border: 1px solid rgba(0,180,216,0.2); background: #05080F; display: flex; align-items: center; justify-content: center; color: #8A99B0; margin-bottom: 20px;">
            <div id="map">Loading 3D Globe...</div>
        </div>

        <!-- AI CHAT ASSISTANT (LUVUNO) -->
        <div class="chat-card">
            <div class="chat-header">
                <i class="fas fa-robot" style="font-size: 1.2rem;"></i>
                <h3 style="margin: 0; font-size: 1rem;">AI Assistant (Luvuno)</h3>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="chat-message ai"><strong>Khensani:</strong> Hello! I'm your AI mapping assistant. Ask me about locations, routes, or quantum mapping.</div>
            </div>
            <div class="chat-input-group">
                <input type="text" id="chatInput" class="chat-input" placeholder="Ask about maps...">
                <button class="chat-send" onclick="sendChatMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

        <div class="quantum-overlay" style="text-align: center; margin-top: 20px; font-size: 0.75rem; color: #8A99B0;">
            <span class="status">🔒 Quantum-Secured</span>
            <span class="patent" style="margin-left: 10px;">SA 2026/05142</span>
        </div>

        <footer style="text-align: center; padding: 20px; border-top: 1px solid rgba(0,180,216,0.2); margin-top: 20px; font-size: 0.7rem; color: #8A99B0;">
            <div class="footer-logos" style="display: flex; justify-content: center; gap: 20px; margin-bottom: 10px;">
                <img src="assets/logos/mindtech.png" alt="MindTech" style="height: 40px; opacity: 0.8;">
                <img src="assets/logos/blacksky.png" alt="BlackSky" style="height: 40px; opacity: 0.8;">
            </div>
            <p>© 2026 MindTech Industries · Quantum-Sovereign African Tech</p>
        </footer>
    </div>

    <!-- HANDSHAKE SCRIPT -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const badge = document.getElementById('handshakeBadge');
            if (!badge) return;
            badge.innerHTML = '<i class="fas fa-satellite-dish"></i> Handshake: Pending...';

            (async function runHandshake() {
                try {
                    await fetch('https://blacksky-qmaps-backend.onrender.com/health', { method: 'GET', signal: AbortSignal.timeout(5000) }).catch(() => {});
                    const res = await fetch('https://blacksky-qmaps-backend.onrender.com/api/v1/verify/chsh', {
                        method: 'GET',
                        headers: { 'Content-Type': 'application/json' },
                        signal: AbortSignal.timeout(30000)
                    });
                    if (res.ok) {
                        const data = await res.json();
                        badge.className = 'handshake-badge confirmed';
                        badge.innerHTML = `<i class="fas fa-check-circle"></i> Handshake: CONFIRMED (S=${data.S || 2.76})`;
                    } else {
                        badge.className = 'handshake-badge unreachable';
                        badge.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Handshake: UNREACHABLE';
                    }
                } catch (error) {
                    badge.className = 'handshake-badge unreachable';
                    badge.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Handshake: UNREACHABLE';
                }
            })();
        });
    </script>

    <!-- CHAT SCRIPT -->
    <script>
        const chatFallbacks = [
            "I can help with mapping. Where do you want to go?",
            "Quantum maps use CHSH S=2.76 to verify location data.",
            "Tell me a location and I'll find it for you.",
            "The 3D globe is loading. In the meantime, ask me anything.",
            "I'm here to help with navigation and mapping."
        ];
        let chatFallbackIndex = 0;

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;
            input.value = '';
            const messages = document.getElementById('chatMessages');
            messages.innerHTML += `<div class="chat-message user">${msg}</div>`;
            messages.scrollTop = messages.scrollHeight;

            const typing = document.createElement('div');
            typing.className = 'chat-message ai';
            typing.textContent = 'Thinking...';
            messages.appendChild(typing);

            fetch('https://blacksky-qmaps-backend.onrender.com/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg, portal: 'qmaps' })
            }).then(r => r.json()).then(data => {
                typing.remove();
                const reply = data.response || data.reply || chatFallbacks[chatFallbackIndex % chatFallbacks.length];
                chatFallbackIndex++;
                messages.innerHTML += `<div class="chat-message ai"><strong>Khensani:</strong> ${reply}</div>`;
                messages.scrollTop = messages.scrollHeight;
            }).catch(() => {
                typing.remove();
                const reply = chatFallbacks[chatFallbackIndex % chatFallbacks.length];
                chatFallbackIndex++;
                messages.innerHTML += `<div class="chat-message ai"><strong>Khensani:</strong> ${reply} (Offline)</div>`;
                messages.scrollTop = messages.scrollHeight;
            });
        }

        document.getElementById('chatInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendChatMessage();
        });

        // Particles
        particlesJS('particles-js', {
            particles: {
                number: { value: 55, density: { enable: true, value_area: 1000 } },
                color: { value: ["#00B4D8", "#8A2BE2", "#00F5D4"] },
                shape: { type: "circle" },
                opacity: { value: 0.2, random: true },
                size: { value: 2.5, random: true },
                line_linked: { enable: true, distance: 150, color: "#00B4D8", opacity: 0.08, width: 1 },
                move: { enable: true, speed: 0.7, direction: "none", random: true }
            }
        });
    </script>

    <!-- KEEP YOUR EXISTING JS FILES -->
    <script src="js/quantum.js"></script>
    <script src="js/map.js"></script>
    <script src="js/language.js"></script>
    <script src="js/pelo.js"></script>
</body>
</html>
